<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyvern</title>
  <link rel="icon" href="/static/wyvern-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand:     #00c8ff;
  --brand-dim: #0099cc;
  --hover:     #7cecff;
  --bg:        #000000;
  --bg-2:      #050505;
  --bg-3:      #0a0a0a;
  --bg-4:      #111111;
  --bg-5:      #171717;
  --text:      #FFFFFF;
  --text-2:    rgba(255,255,255,0.86);
  --text-muted:rgba(255,255,255,0.45);
  --red:       #e74c3c;
  --green:     #2ecc71;
  --yellow:    #f39c12;
  --radius:    8px;
  --font-head: 'Orbitron', sans-serif;
  --font-body: 'Inter', sans-serif;
  --sidebar-icons: 68px;
  --sidebar-channels: 224px;
  --sidebar-members: 236px;
  --header-h: 52px;
  --input-h: 64px;
  --transition: 0.15s ease;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app { height: 100vh; display: flex; flex-direction: column; }

.boot-loader {
  position: fixed;
  inset: 0;
  z-index: 20000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--bg);
  transition: opacity 0.28s ease;
}
.boot-loader.hidden {
  opacity: 0;
  pointer-events: none;
}
.boot-loader-logo {
  width: 56px;
  height: 56px;
  object-fit: contain;
  filter: drop-shadow(0 8px 22px rgba(0,200,255,0.35));
  animation: loaderFloat 1.2s ease-in-out infinite alternate;
}
.boot-loader-spinner {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.18);
  border-top-color: var(--hover);
  animation: spin 0.75s linear infinite;
}
.boot-loader-text {
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-2);
  text-transform: uppercase;
}
@keyframes loaderFloat {
  from { transform: translateY(-2px); }
  to { transform: translateY(3px); }
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-5); border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--bg-5) transparent; }

/* ── Button Reset ── */
button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; font-size: inherit; }

.ui-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
  flex-shrink: 0;
}
.ui-icon svg {
  width: 100%;
  height: 100%;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ui-icon.is-solid svg {
  stroke: none;
  fill: currentColor;
}
.icon-with-text,
.icon-with-count {
  display: inline-flex;
  align-items: center;
}
.icon-with-text {
  gap: 8px;
}
.icon-with-count {
  gap: 6px;
}
.icon-count {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.2px;
}

/* ── Input Reset ── */
input, textarea {
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text);
  background: none;
  border: none;
  outline: none;
}
input::placeholder, textarea::placeholder { color: var(--text-muted); }

/* ── Auth View ── */
.auth-view {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.auth-bg {
  display: none;
}

.auth-card {
  position: relative;
  width: 420px;
  background: var(--bg);
  border: 1px solid rgba(0,200,255,0.3);
  border-radius: 16px;
  padding: 40px;
  animation: slideUp 0.4s ease both;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.auth-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.auth-logo-icon {
  width: 44px;
  height: 44px;
  background: rgba(0,200,255,0.16);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.auth-logo-icon img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

.auth-logo-text {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 1px;
}

.auth-title {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.auth-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.auth-field label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-family: var(--font-head);
}

.auth-field input {
  background: var(--bg-4);
  border: 1px solid var(--bg-5);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-size: 14px;
  color: var(--text);
  transition: border-color var(--transition);
}

.auth-field input:focus { border-color: var(--brand); }

.btn-primary {
  width: 100%;
  padding: 12px;
  background: rgba(0,200,255,0.08);
  color: var(--brand);
  border: 1px solid rgba(0,200,255,0.16);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background var(--transition), transform 0.1s, box-shadow var(--transition);
  margin-top: 8px;
}
.btn-primary:hover { background: rgba(0,200,255,0.16); box-shadow: 0 0 12px rgba(0,200,255,0.14); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.auth-switch {
  text-align: center;
  margin-top: 18px;
  font-size: 13px;
  color: var(--text-muted);
}

.auth-switch button {
  color: var(--hover);
  font-weight: 600;
  margin-left: 4px;
  transition: color var(--transition);
}
.auth-switch button:hover { color: var(--text); }

.auth-error {
  background: rgba(231,76,60,0.15);
  border: 1px solid rgba(231,76,60,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 13px;
  color: #ff8a80;
}

/* ── App Layout ── */
.app-layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Icon Sidebar ── */
.icon-sidebar {
  width: var(--sidebar-icons);
  background: var(--bg-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0;
  gap: 4px;
  overflow-y: auto;
  overflow-x: hidden;
  border-right: 1px solid rgba(255,255,255,0.04);
  flex-shrink: 0;
}

.sidebar-logo {
  width: 44px;
  height: 44px;
  background: var(--brand);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-radius var(--transition), background var(--transition);
  flex-shrink: 0;
}

.sidebar-logo {
  margin-bottom: 4px;
}
.sidebar-logo:hover,
.sidebar-logo.active {
  background: var(--hover);
  border-radius: 10px;
}

.sidebar-logo.full-icon {
  padding: 0;
  overflow: hidden;
  background: transparent;
}

.sidebar-logo.full-icon:hover,
.sidebar-logo.full-icon.active {
  background: transparent;
  border-radius: 10px;
}

.icon-core {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: rgba(255,255,255,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-logo img {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

.sidebar-logo.full-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.sidebar-sep {
  width: 32px;
  height: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 1px;
  margin: 4px 0;
  flex-shrink: 0;
}

.server-pill {
  position: relative;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 700;
  transition: border-radius var(--transition);
  flex-shrink: 0;
  user-select: none;
  overflow: hidden;
}
.server-pill:hover { border-radius: 14px; }
.server-pill.active {
  border-radius: 14px;
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}
.server-pill-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}
.server-pill::before {
  content: '';
  position: absolute;
  left: -12px;
  width: 4px;
  background: var(--text);
  border-radius: 0 3px 3px 0;
  transition: height var(--transition);
  height: 0;
}
.server-pill:hover::before { height: 20px; }
.server-pill.active::before { height: 40px; }

.server-pill-add {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px dashed rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: all var(--transition);
  flex-shrink: 0;
}
.server-pill-add:hover {
  border-color: var(--green);
  color: var(--green);
  border-radius: 14px;
}
.server-pill-add .ui-icon {
  width: 20px;
  height: 20px;
}

/* DM icon */
/* ── Channel Sidebar ── */
.channel-sidebar {
  width: var(--sidebar-channels);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,0.04);
}

.server-name-bar {
  height: var(--header-h);
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  cursor: pointer;
  transition: background var(--transition);
  flex-shrink: 0;
}
.server-name-bar:hover { background: rgba(255,255,255,0.03); }
.server-name-bar h2 {
  font-family: var(--font-head);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.server-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}
.server-title-icon {
  width: 20px;
  height: 20px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.18);
  flex-shrink: 0;
}

.channel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 8px;
}

.ch-category {
  padding: 14px 8px 3px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.ch-category span {
  font-family: var(--font-head);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  transition: color var(--transition);
}
.ch-category:hover span { color: var(--text-2); }
.ch-category .cat-plus {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  border-radius: 4px;
}
.ch-category .cat-plus:hover { color: var(--text); background: var(--bg-4); }
.ch-category .cat-plus .ui-icon {
  width: 14px;
  height: 14px;
}

.ch-item {
  margin: 1px 6px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
  user-select: none;
}
.ch-item:hover { background: var(--bg-4); color: var(--text-2); }
.ch-item.active { background: rgba(0,200,255,0.25); color: var(--text); }
.ch-item .ch-hash {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  color: inherit;
}
.ch-item .ch-hash .ui-icon {
  width: 16px;
  height: 16px;
}
.ch-item .ch-name {
  flex: 1;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ch-badge {
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

/* User panel */
.user-panel {
  padding: 8px 10px;
  background: var(--bg);
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.user-av {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--brand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
}
.avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}
.status-ring {
  position: absolute;
  bottom: -1px;
  right: -1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--bg);
}
.s-online { background: var(--green); }
.s-idle   { background: var(--yellow); }
.s-dnd    { background: var(--red); }
.s-offline{ background: #555; }
.user-info-mini { flex: 1; overflow: hidden; }
.user-info-mini .uname { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-info-mini .utag  { font-size: 11px; color: var(--text-muted); }
.panel-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
}
.panel-btn:hover { background: var(--bg-4); color: var(--text); }
.panel-btn .ui-icon {
  width: 16px;
  height: 16px;
}
.panel-status-btn {
  position: relative;
}
.status-dot-inline {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--bg);
  display: inline-flex;
}
.status-menu {
  position: fixed;
  z-index: 12000;
  min-width: 188px;
  padding: 8px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  background: #050505;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
}
.status-option {
  width: 100%;
  padding: 9px 10px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-2);
  transition: background var(--transition), color var(--transition);
}
.status-option:hover {
  background: rgba(255,255,255,0.05);
  color: var(--text);
}
.status-option.active {
  background: rgba(0,200,255,0.12);
}
.status-option-copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.status-option-label {
  font-size: 13px;
  font-weight: 600;
}
.status-option-sub {
  font-size: 11px;
  color: var(--text-muted);
}

/* ── Main Chat ── */
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  min-width: 0;
}

.chat-topbar {
  height: var(--header-h);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
}
.chat-topbar .ch-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  color: var(--text-muted);
}
.chat-topbar .ch-icon .ui-icon {
  width: 18px;
  height: 18px;
}
.chat-topbar h3 {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.topbar-desc {
  font-size: 12px;
  color: var(--text-muted);
  padding-left: 10px;
  border-left: 1px solid var(--bg-5);
  margin-left: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topbar-actions { margin-left: auto; display: flex; gap: 2px; }
.topbar-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
}
.topbar-btn:hover { background: var(--bg-4); color: var(--text); }
.topbar-btn .ui-icon {
  width: 18px;
  height: 18px;
}

/* ── Messages ── */
.messages-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 0;
  display: flex;
  flex-direction: column;
}

.msg-group {
  padding: 3px 16px;
  display: flex;
  gap: 14px;
  transition: background 0.1s;
  animation: msgIn 0.2s ease both;
}
.msg-group.is-merged {
  padding-top: 1px;
  padding-bottom: 1px;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-group:hover { background: rgba(255,255,255,0.02); }
.msg-group:hover .msg-actions { opacity: 1; }
.msg-group.flash { background: rgba(0,200,255,0.12); }

.msg-av {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.msg-av:hover { filter: brightness(1.15); }
.msg-avatar-gap {
  width: 38px;
  flex-shrink: 0;
}

.msg-body { flex: 1; min-width: 0; }
.msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg-author {
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.msg-author:hover { text-decoration: underline; }
.msg-author.is-self  { color: var(--hover); }
.msg-author.is-mod   { color: #e74c3c; }
.msg-author.is-admin { color: #f39c12; }
.role-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.badge-mod   { background: rgba(231,76,60,0.2);  color: #e74c3c; }
.badge-admin { background: rgba(243,156,18,0.2); color: #f39c12; }
.msg-time { font-size: 11px; color: var(--text-muted); }
.msg-text { font-size: 14px; line-height: 1.55; color: var(--text-2); word-break: break-word; }
.msg-group.is-merged .msg-text { margin-top: 0; }
.msg-text .mention {
  background: rgba(0,200,255,0.25);
  color: var(--hover);
  border-radius: 3px;
  padding: 0 3px;
  cursor: pointer;
}
.msg-text code {
  background: rgba(0,0,0,0.4);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #e2b96f;
}
.msg-text .msg-link {
  color: var(--hover);
  text-decoration: underline;
  text-decoration-color: rgba(0,200,255,0.55);
  text-underline-offset: 2px;
  cursor: pointer;
  transition: color var(--transition), text-decoration-color var(--transition);
}
.msg-text .msg-link:hover {
  color: var(--text);
  text-decoration-color: rgba(255,255,255,0.85);
}
.msg-text .edited-tag { font-size: 10px; color: var(--text-muted); margin-left: 4px; }

.msg-reply-preview {
  margin-bottom: 2px;
  max-width: 520px;
  padding: 0;
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  text-align: left;
}
.msg-reply-preview::before {
  content: '';
  width: 15px;
  height: 10px;
  flex-shrink: 0;
  align-self: flex-end;
  border-left: 2px solid rgba(255,255,255,0.18);
  border-top: 2px solid rgba(255,255,255,0.18);
  border-top-left-radius: 10px;
  margin-right: -1px;
}
.msg-reply-preview:hover::before {
  border-color: rgba(0,200,255,0.48);
}
.msg-reply-avatar {
  width: 16px;
  height: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.32);
}
.msg-reply-line {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.msg-reply-author {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  white-space: nowrap;
}
.msg-reply-snippet {
  font-size: 12px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.msg-reply-preview:hover .msg-reply-author {
  color: var(--hover);
}
.msg-reply-preview:hover .msg-reply-snippet {
  color: var(--text-2);
}

.link-embed {
  margin-top: 8px;
  max-width: 520px;
  border-radius: 10px;
  border: 1px solid rgba(0,200,255,0.35);
  background: #000000;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition), transform 0.12s ease;
}
.link-embed:hover {
  border-color: rgba(0,200,255,0.75);
  background: #000000;
  transform: translateY(-1px);
}
.link-embed-host {
  font-family: var(--font-head);
  font-size: 10px;
  letter-spacing: 0.9px;
  color: var(--text-muted);
  text-transform: uppercase;
}
.link-embed-title {
  margin-top: 4px;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  word-break: break-word;
}
.link-embed-url {
  margin-top: 4px;
  font-size: 12px;
  color: var(--hover);
  word-break: break-all;
}
.link-embed-hint {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-muted);
}

.msg-attachment {
  margin-top: 6px;
  max-width: 420px;
}
.msg-media-image {
  max-width: 100%;
  max-height: 340px;
  border-radius: 10px;
  border: 1px solid var(--bg-5);
  display: block;
  background: var(--bg-4);
}
.msg-media-video {
  width: 100%;
  max-height: 340px;
  border-radius: 10px;
  border: 1px solid var(--bg-5);
  background: #000;
}
.msg-media-audio {
  width: 100%;
  max-width: 340px;
}
.msg-attachment a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-4);
  border: 1px solid var(--bg-5);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--hover);
  text-decoration: none;
  font-size: 13px;
  transition: background var(--transition);
}
.msg-attachment a:hover { background: var(--bg-5); }

.msg-reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.reaction-chip {
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,200,255,0.12);
  border: 1px solid rgba(0,200,255,0.25);
  border-radius: 12px;
  padding: 2px 8px;
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition);
  user-select: none;
}
.reaction-chip:hover { background: rgba(0,200,255,0.28); }
.reaction-chip.mine { border-color: var(--brand); background: rgba(0,200,255,0.3); }
.reaction-chip .rc-count { color: var(--hover); font-weight: 600; }

.msg-actions {
  opacity: 0;
  display: flex;
  gap: 2px;
  transition: opacity var(--transition);
  position: absolute;
  right: 16px;
  margin-top: -4px;
}
.msg-group { position: relative; }
.act-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-4);
  border: 1px solid var(--bg-5);
  color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
}
.act-btn .ui-icon {
  width: 16px;
  height: 16px;
}
.act-btn:hover { background: var(--bg-5); color: var(--text); }
.act-btn.danger:hover { background: rgba(231,76,60,0.2); color: var(--red); }

.msg-day-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
}
.msg-day-divider::before, .msg-day-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.07);
}

.load-more-btn {
  align-self: center;
  margin: 8px 0;
  padding: 6px 16px;
  background: var(--bg-4);
  border: 1px solid var(--bg-5);
  border-radius: 20px;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition);
}
.load-more-btn:hover { background: var(--bg-5); color: var(--text); }
.load-more-btn .ui-icon {
  width: 14px;
  height: 14px;
}

.empty-channel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  gap: 10px;
  font-size: 14px;
}
.empty-channel .empty-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
}
.empty-channel .empty-icon .ui-icon {
  width: 48px;
  height: 48px;
}
.empty-channel h4 { font-family: var(--font-head); font-size: 14px; font-weight: 700; color: var(--text-2); }

/* Typing */
.typing-bar {
  height: 20px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
}
.typing-dots { display: flex; gap: 3px; align-items: center; }
.typing-dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: tdot 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%            { transform: translateY(-4px); opacity: 1; }
}

/* Input area */
.chat-input-area {
  padding: 0 16px 12px;
  flex-shrink: 0;
}
.composer-reply {
  margin-bottom: 8px;
  padding: 10px 12px;
  border: 1px solid rgba(0,200,255,0.18);
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  display: flex;
  align-items: center;
  gap: 10px;
}
.composer-reply-main {
  min-width: 0;
  flex: 1;
}
.composer-reply-label {
  font-family: var(--font-head);
  font-size: 10px;
  letter-spacing: 0.8px;
  color: var(--hover);
  text-transform: uppercase;
}
.composer-reply-snippet {
  margin-top: 3px;
  font-size: 12px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.composer-reply-close {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), color var(--transition);
}
.composer-reply-close:hover {
  background: var(--bg-4);
  color: var(--text);
}
.composer-reply-close .ui-icon {
  width: 14px;
  height: 14px;
}
.composer-attachments {
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.composer-attachment-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  color: var(--text-2);
  font-size: 12px;
  transition: border-color var(--transition), background var(--transition);
}
.composer-attachment-chip:hover {
  background: rgba(0,200,255,0.08);
  border-color: rgba(0,200,255,0.24);
}
.composer-attachment-kind {
  font-family: var(--font-head);
  font-size: 10px;
  letter-spacing: 0.8px;
  color: var(--hover);
  text-transform: uppercase;
}
.composer-attachment-name {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.composer-attachment-chip .ui-icon {
  width: 12px;
  height: 12px;
}
.chat-input-box {
  background: var(--bg);
  border: 1px solid transparent;
  border-radius: 12px;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  padding: 0 10px;
  transition: border-color var(--transition);
}
.chat-input-box:focus-within { border-color: var(--brand); }
.input-icon-btn {
  padding: 10px 4px;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color var(--transition);
  flex-shrink: 0;
}
.input-icon-btn:hover { color: var(--hover); }
.input-icon-btn .ui-icon {
  width: 18px;
  height: 18px;
}
.input-pill-btn {
  min-width: 52px;
  height: 30px;
  margin-bottom: 7px;
  padding: 0 10px;
  border-radius: 999px;
  background: rgba(0,200,255,0.08);
  color: var(--hover);
  font-family: var(--font-head);
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  transition: background var(--transition), color var(--transition), box-shadow var(--transition);
  flex-shrink: 0;
}
.input-pill-btn:hover {
  background: rgba(0,200,255,0.16);
  color: var(--text);
}
.input-pill-btn.active {
  background: rgba(0,200,255,0.2);
  color: var(--text);
  box-shadow: 0 0 0 1px rgba(0,200,255,0.25) inset;
}
.chat-textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  padding: 12px 0;
  resize: none;
  max-height: 200px;
  min-height: 44px;
  line-height: 1.5;
}
.send-btn {
  padding: 8px;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: color var(--transition), background var(--transition);
  flex-shrink: 0;
  margin-bottom: 4px;
}
.send-btn:hover { color: var(--hover); background: rgba(0,200,255,0.1); }
.send-btn.ready { color: var(--brand); }
.send-btn .ui-icon {
  width: 18px;
  height: 18px;
}

/* ── Member Sidebar ── */
.member-sidebar {
  width: var(--sidebar-members);
  background: var(--bg);
  border-left: 1px solid rgba(255,255,255,0.04);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 12px 0;
}

.member-cat {
  padding: 10px 14px 3px;
  font-family: var(--font-head);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.member-row {
  padding: 5px 10px;
  margin: 1px 6px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background var(--transition);
  user-select: none;
}
.member-row:hover { background: var(--bg-4); }
.member-av {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  position: relative;
}
.member-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-name.muted { color: var(--text-muted); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: var(--bg-4);
  border: 1px solid var(--bg-5);
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 9999;
  animation: toastIn 0.25s ease;
  white-space: nowrap;
}
.toast.error { border-color: var(--red); color: #ff8a80; }
.toast.success { border-color: var(--green); color: var(--green); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(12px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.push-stack {
  position: fixed;
  top: 16px;
  right: 16px;
  width: min(340px, calc(100vw - 24px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 12000;
}
.push-note {
  background: #000000;
  border: 1px solid rgba(0,200,255,0.4);
  border-radius: 10px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.45);
  padding: 10px 12px;
  cursor: pointer;
  animation: pushIn 0.18s ease;
}
.push-note:hover { border-color: rgba(0,200,255,0.8); }
.push-title {
  font-family: var(--font-head);
  font-size: 11px;
  letter-spacing: 0.8px;
  color: var(--text);
  text-transform: uppercase;
}
.push-body {
  margin-top: 4px;
  font-size: 13px;
  color: var(--text-2);
  word-break: break-word;
}
.push-meta {
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-muted);
}
.push-note.fade-out {
  opacity: 0;
  transform: translateY(-5px);
  transition: opacity 0.16s ease, transform 0.16s ease;
}
@keyframes pushIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.15s ease;
}
.modal-overlay[hidden] {
  display: none !important;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg);
  border: 1px solid rgba(0,200,255,0.3);
  border-radius: 14px;
  padding: 28px;
  width: 380px;
  animation: slideUp 0.2s ease;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}
.modal h3 {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 18px;
  color: var(--text);
}
.modal-input {
  width: 100%;
  background: var(--bg-4);
  border: 1px solid var(--bg-5);
  border-radius: var(--radius);
  padding: 10px 13px;
  font-size: 14px;
  color: var(--text);
  margin-bottom: 14px;
  transition: border-color var(--transition);
}
.modal-input:focus { border-color: var(--brand); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn-ghost {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
}
.btn-ghost:hover { background: var(--bg-4); color: var(--text); }
.btn-confirm {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--brand);
  color: white;
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: background var(--transition);
}
.btn-confirm:hover { background: var(--brand-dim); }

.changelog-modal {
  width: min(860px, calc(100vw - 32px));
  max-height: min(84vh, 920px);
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.changelog-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.02);
}
.changelog-modal-title {
  font-family: var(--font-head);
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--brand);
}
.changelog-modal-body {
  padding: 22px;
  overflow: auto;
  color: var(--text-2);
  line-height: 1.8;
}
.changelog-modal-body > * + * {
  margin-top: 14px;
}
.changelog-modal-body h1,
.changelog-modal-body h2,
.changelog-modal-body h3 {
  font-family: var(--font-head);
  color: var(--text);
  line-height: 1.2;
}
.changelog-modal-body h1 { font-size: 24px; }
.changelog-modal-body h2 { font-size: 18px; margin-top: 20px; }
.changelog-modal-body h3 { font-size: 15px; margin-top: 16px; }
.changelog-modal-body p { margin: 0; }
.changelog-modal-body ul,
.changelog-modal-body ol {
  padding-left: 20px;
  display: grid;
  gap: 8px;
}
.changelog-modal-body li::marker { color: var(--brand); }
.changelog-modal-body a {
  color: var(--brand);
  text-decoration: none;
}
.changelog-modal-body a:hover { text-decoration: underline; }
.changelog-modal-body code {
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
}
.changelog-modal-body pre {
  overflow-x: auto;
  padding: 14px 16px;
  border-radius: 8px;
  background: var(--bg-2);
  border: 1px solid rgba(255,255,255,0.06);
}
.changelog-modal-body blockquote {
  margin: 0;
  padding: 12px 16px;
  border-left: 2px solid var(--brand);
  background: rgba(0,200,255,0.05);
  color: var(--text-2);
}
.changelog-modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 18px;
}

.link-open-modal {
  width: min(520px, calc(100vw - 28px));
}
.link-open-title {
  font-family: var(--font-head);
  font-size: 13px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.link-open-url {
  background: var(--bg-4);
  border: 1px solid var(--bg-5);
  border-radius: 8px;
  color: var(--hover);
  font-size: 12px;
  line-height: 1.35;
  padding: 10px 11px;
  word-break: break-all;
  margin-bottom: 12px;
}
.link-open-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.settings-modal {
  width: min(560px, calc(100vw - 32px));
  padding: 0;
  overflow: hidden;
}
.settings-head {
  padding: 18px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  background: #000000;
}
.settings-title {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.6px;
  text-transform: uppercase;
}
.settings-subtitle {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 12px;
}
.settings-body {
  padding: 18px 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.settings-icon-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.settings-icon-preview {
  width: 78px;
  height: 78px;
  border-radius: 22px;
  background: rgba(0,200,255,0.2);
  border: 1px solid rgba(255,255,255,0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.settings-icon-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.settings-icon-fallback {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 700;
  color: rgba(255,255,255,0.88);
  text-transform: uppercase;
}
.settings-icon-meta {
  flex: 1;
  min-width: 0;
}
.settings-icon-label {
  font-family: var(--font-head);
  color: var(--text-2);
  font-size: 11px;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.settings-icon-help {
  color: var(--text-muted);
  font-size: 12px;
}
.settings-upload-actions {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.btn-soft {
  padding: 8px 12px;

  <script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// WYVERN FRONTEND v1
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//
// BACKEND_URL: set to a full URL (e.g. "https://api.wyvern.app") to point to
// a remote server. Leave as null to use relative paths (same-origin hosting).
//
// Example: const BACKEND_URL = "https://api.wyvern.app";
//
// ─── Config ───────────────────────────────────────────────────────────────────
// Set BACKEND_URL to a full URL (e.g. "https://api.wyvern.app") to point to a
// remote server. Leave as null to use relative paths (same origin).
const BACKEND_URL = null;

const API_PREFIX = '/api/v1';
const WYVERN_LOGO_URL = '/static/wyvern-logo.png';
const WYVERN_SECTION_LOGO_URL = '/wyvern_logo.png';

function base(path) {
  return BACKEND_URL ? `${BACKEND_URL}${path}` : path;
}

// ─── Token Storage ────────────────────────────────────────────────────────────
const token = {
  get access() { return sessionStorage.getItem('wy_access'); },
  get refresh() { return sessionStorage.getItem('wy_refresh'); },
  set(access, refresh) {
    sessionStorage.setItem('wy_access', access);
    if (refresh) sessionStorage.setItem('wy_refresh', refresh);
  },
  clear() {
    sessionStorage.removeItem('wy_access');
    sessionStorage.removeItem('wy_refresh');
  }
};

// ─── Core Fetch ───────────────────────────────────────────────────────────────
async function req(method, path, body, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token.access) headers['Authorization'] = `Bearer ${token.access}`;

  const res = await fetch(base(`${API_PREFIX}${path}`), {
    method,
    headers: opts.noContentType ? { Authorization: headers.Authorization } : headers,
    body: body && !opts.noContentType ? JSON.stringify(body) : body,
  });

  if (res.status === 401 && !opts.noRefresh) {
    const refreshed = await tryRefresh();
    if (refreshed) return req(method, path, body, { ...opts, noRefresh: true });
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw data?.error || { message: res.statusText };
  return data.data ?? data;
}

async function tryRefresh() {
  if (!token.refresh) return false;
  try {
    const res = await fetch(base(`${API_PREFIX}/auth/refresh`), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: token.refresh }),
    });
    if (!res.ok) { token.clear(); return false; }
    const d = await res.json();
    const access = d.data?.tokens?.access_token || d.data?.access_token || d.access_token;
    const refresh = d.data?.tokens?.refresh_token || d.data?.refresh_token || d.refresh_token;
    if (!access) { token.clear(); return false; }
    token.set(access, refresh);
    return true;
  } catch { token.clear(); return false; }
}

// ─── Auth ─────────────────────────────────────────────────────────────────────
const auth = {
  register: (username, email, password, displayName = null) =>
    req('POST', '/auth/register', { username, email, password, display_name: displayName || undefined }),
  login: async (email, password) => {
    const d = await req('POST', '/auth/login', { email, password });
    const access = d.tokens?.access_token || d.access_token;
    const refresh = d.tokens?.refresh_token || d.refresh_token;
    if (!access) throw new Error('Login response missing access token');
    token.set(access, refresh);
    return d;
  },
  logout: async () => {
    const refresh = token.refresh;
    if (refresh) {
      await req('POST', '/auth/logout', { refresh_token: refresh }).catch(() => {});
    }
    token.clear();
  },
};

// ─── Users ────────────────────────────────────────────────────────────────────
const users = {
  me: () => req('GET', '/users/me'),
  update: (body) => req('PATCH', '/users/me', body),
  setPresence: (status) => req('PUT', '/users/me/presence', { status }),
  get: (id) => req('GET', `/users/${id}`),
  getPresence: (id) => req('GET', `/users/${id}/presence`),
  lookup: (query) => req('GET', `/users/lookup?q=${encodeURIComponent(query)}`),
  directory: () => req('GET', '/users/directory'),
};
const userCache = new Map();
const userFetchInFlight = new Map();

async function enrichUserPresence(user) {
  if (!user?.id) return user || null;
  const presenceData = await users.getPresence(user.id).catch(() => null);
  const enriched = {
    ...(user || {}),
    presence: presenceData?.status || user.presence || 'offline',
  };
  userCache.set(enriched.id, enriched);
  return enriched;
}

async function getUserCached(userId) {
  if (!userId) return null;
  if (userCache.has(userId)) return userCache.get(userId);
  if (userFetchInFlight.has(userId)) return userFetchInFlight.get(userId);

  const fetchPromise = Promise.all([
      users.get(userId),
      users.getPresence(userId).catch(() => null),
    ])
    .then(([user, presenceData]) => {
      if (!user?.id) return null;
      const enriched = {
        ...user,
        presence: presenceData?.status || user.presence || 'offline',
      };
      userCache.set(enriched.id, enriched);
      return enriched;
    })
    .catch(() => null)
    .finally(() => userFetchInFlight.delete(userId));

  userFetchInFlight.set(userId, fetchPromise);
  return fetchPromise;
}

class WyvernSocket {
  constructor(onEvent) {
    this.onEvent = onEvent;
    this.ws = null;
    this.reconnectDelay = 1000;
    this._pingInterval = null;
  }

  connect() {
    if (!token.access) return;
    const wsBase = BACKEND_URL
      ? BACKEND_URL.replace(/^http/, 'ws')
      : `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
    const url = `${wsBase}/ws?token=${token.access}`;
    this.ws = new WebSocket(url);

    this.ws.onopen = () => {
      this.reconnectDelay = 1000;
      this._pingInterval = setInterval(() => this.send({ action: 'ping' }), 30000);
      this.onEvent({ type: 'connected' });
    };

    this.ws.onmessage = (e) => {
      try { this.onEvent(JSON.parse(e.data)); } catch {}
    };

    this.ws.onclose = () => {
      clearInterval(this._pingInterval);
      this.onEvent({ type: 'disconnected' });
      setTimeout(() => this.connect(), this.reconnectDelay);
      this.reconnectDelay = Math.min(this.reconnectDelay * 2, 30000);
    };
  }

  send(obj) {
    if (this.ws?.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify(obj));
    }
  }

  subscribe(channelIds) { this.send({ action: 'subscribe', channel_ids: channelIds }); }
  unsubscribe(channelIds) { this.send({ action: 'unsubscribe', channel_ids: channelIds }); }

  disconnect() {
    clearInterval(this._pingInterval);
    this.ws?.close();
  }
}


// Minimal reactive state store
class Store {
  constructor(initial) {
    this._state = { ...initial };
    this._listeners = new Set();
  }

  get state() { return this._state; }

  set(partial) {
    this._state = { ...this._state, ...partial };
    this._listeners.forEach(fn => fn(this._state));
  }

  subscribe(fn) {
    this._listeners.add(fn);
    return () => this._listeners.delete(fn);
  }
}

let pushStackEl = null;

function ensurePushStack() {
  if (pushStackEl && document.body.contains(pushStackEl)) return pushStackEl;
  pushStackEl = el('div', { class: 'push-stack' });
  document.body.appendChild(pushStackEl);
  return pushStackEl;
}

function pushNotification({ title, body, meta = '', duration = 15000, onClick = null }) {
  const stack = ensurePushStack();
  const note = el('div', { class: 'push-note' },
    el('div', { class: 'push-title' }, title || 'Notification'),
    el('div', { class: 'push-body' }, body || ''),
    meta ? el('div', { class: 'push-meta' }, meta) : null
  );

  let removed = false;
  const removeNote = () => {
    if (removed) return;
    removed = true;
    note.classList.add('fade-out');
    setTimeout(() => note.remove(), 170);
  };

  note.addEventListener('click', async () => {
    if (typeof onClick === 'function') {
      try {
        await onClick();
      } catch {}
    }
    removeNote();
  });

  stack.appendChild(note);
  setTimeout(removeNote, Math.max(1000, duration));
  return removeNote;
}


// ─── DOM helpers ─────────────────────────────────────────────────────────────
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function avatarColor(str = '') {
  let h = 0;
  for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}

function initials(name = '') {
  const parts = name.trim().split(/\s+/);

  return (name.slice(0, 2)).toUpperCase();
}

// ─── Date helpers ─────────────────────────────────────────────────────────────
function fmtTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const h = d.getHours().toString().padStart(2, '0');
  const m = d.getMinutes().toString().padStart(2, '0');
  if (isToday) return `Today at ${h}:${m}`;
  const y = d.getFullYear() === now.getFullYear() ? '' : `/${d.getFullYear()}`;
  return `${d.getMonth()+1}/${d.getDate()}${y} ${h}:${m}`;
}

function fmtDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Today';
  const y = d.getFullYear() === now.getFullYear() ? '' : `, ${d.getFullYear()}`;
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) + y;
}

function sameDay(a, b) {
  const da = new Date(a), db = new Date(b);
  return da.toDateString() === db.toDateString();
}

// ─── Sanitize ─────────────────────────────────────────────────────────────────
function safe(str = '') {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function normalizeDetectedUrlCandidate(raw = '') {
  let url = (raw || '').trim();
  let trailing = '';
  while (url && /[),.!?;:]/.test(url[url.length - 1])) {
    trailing = url[url.length - 1] + trailing;
    url = url.slice(0, -1);
  }
  return { url, trailing };
}

function normalizeNavigableUrl(raw = '') {
  const candidate = (raw || '').trim();
  if (!candidate) return null;
  try {
    const parsed = new URL(candidate, location.origin);
    if (!['http:', 'https:'].includes(parsed.protocol)) return null;
    return parsed.toString();
  } catch {
    return null;
  }
}

function extractHttpLinks(text = '') {
  const urls = [];
  const seen = new Set();
  const regex = /https?:\/\/[^\s`]+/gi;
  let match;
  while ((match = regex.exec(text || '')) !== null) {
    const { url } = normalizeDetectedUrlCandidate(match[0]);
    const normalized = normalizeNavigableUrl(url);
    if (!normalized || seen.has(normalized)) continue;
    seen.add(normalized);
    urls.push(normalized);
  }
  return urls;
}

function renderMentionText(text = '') {
  return safe(text).replace(/@(\w+)/g, '<span class="mention">@$1</span>');
}

function renderTextWithLinks(text = '') {
  const regex = /https?:\/\/[^\s`]+/gi;
  let html = '';
  let last = 0;
  let match;

  while ((match = regex.exec(text || '')) !== null) {
    html += renderMentionText((text || '').slice(last, match.index));
    const { url, trailing } = normalizeDetectedUrlCandidate(match[0]);
    const normalized = normalizeNavigableUrl(url);
    if (normalized) {
      const safeUrl = safe(normalized);
      html += `<a class="msg-link" href="${safeUrl}" data-url="${safeUrl}">${safeUrl}</a>`;
    } else {
      html += renderMentionText(match[0]);
    }
    if (trailing) html += safe(trailing);
    last = match.index + match[0].length;
  }

  html += renderMentionText((text || '').slice(last));
  return html;
}

function renderContent(text = '') {
  const source = String(text || '');
  const codeRegex = /`([^`]+)`/g;
  let html = '';
  let cursor = 0;
  let match;

  while ((match = codeRegex.exec(source)) !== null) {
    html += renderTextWithLinks(source.slice(cursor, match.index));
    html += `<code>${safe(match[1])}</code>`;
    cursor = match.index + match[0].length;
  }

  html += renderTextWithLinks(source.slice(cursor));
  return html;
}

function toAttachmentObj(att) {
  if (!att) return null;
  if (typeof att === 'string') {
    const parts = att.split('/');
    return { url: att, filename: decodeURIComponent(parts[parts.length - 1] || 'Attachment') };
  }
  if (typeof att === 'object' && att.url) {
    return { url: att.url, filename: att.filename || decodeURIComponent(att.url.split('/').pop() || 'Attachment') };
  }
  return null;
}

function mediaKind(url = '') {
  const lower = url.toLowerCase().split('?')[0];
  if (/\.(png|jpe?g|gif|webp|bmp|svg|avif)$/.test(lower)) return 'image';
  if (/\.(mp4|webm|mov|m4v|mkv)$/.test(lower)) return 'video';
  if (/\.(mp3|wav|ogg|m4a|flac)$/.test(lower)) return 'audio';
  return 'file';
}

function extractMediaUrls(text = '') {
  return (text.match(/\/media\/[^\s]+/g) || []);
}

function shouldRenderLinkEmbed(url = '') {
  const normalized = normalizeNavigableUrl(url);
  if (!normalized) return false;
  if (normalized.includes('/media/')) return false;
  return mediaKind(normalized) === 'file';
}

function isGifUrl(url = '') {
  const normalized = normalizeNavigableUrl(url) || String(url || '').trim();
  const lower = normalized.toLowerCase();
  return /\.gif($|\?)/.test(lower)
    || lower.includes('media.giphy.com/media/')
    || lower.includes('media.tenor.com/');
}

function messagePreviewText(message, maxLength = 90) {
  const source = typeof message === 'string' ? message : String(message?.content || '').trim();
  const attachments = Array.isArray(message?.attachments) ? message.attachments.map(toAttachmentObj).filter(Boolean) : [];
  let preview = source;
  if (!preview) {
    if (attachments.some((item) => isGifUrl(item.url))) preview = 'GIF';
    else if (attachments.length === 1) preview = attachments[0].filename || 'Attachment';
    else if (attachments.length > 1) preview = `${attachments.length} attachments`;
    else preview = 'Message';
  }
  if (preview.length <= maxLength) return preview;
  return `${preview.slice(0, maxLength).trim()}...`;
}

function formatLinkTitle(url = '') {
  try {
    const parsed = new URL(url);
    const raw = decodeURIComponent(parsed.pathname || '/');
    const segments = raw.split('/').filter(Boolean);
    if (!segments.length) return parsed.hostname.replace(/^www\./i, '');
    const title = segments[segments.length - 1].replace(/[-_]+/g, ' ').trim();
    return title || parsed.hostname.replace(/^www\./i, '');
  } catch {
    return url;
  }
}

function createLinkEmbed(url = '') {
  const normalized = normalizeNavigableUrl(url);
  if (!normalized) return null;

  let host = normalized;
  try {
    host = new URL(normalized).hostname.replace(/^www\./i, '');

  return el('div', {
    class: 'link-embed',

      event.preventDefault();

      showLinkOpenOptions(normalized);
    }

  );
}

function parseInviteCode(input = '') {
  const raw = (input || '').trim();
  if (!raw) return '';

  try {
    const parsed = new URL(raw, location.origin);
    const parts = parsed.pathname.split('/').filter(Boolean);
    const inviteIdx = parts.findIndex((part) => part.toLowerCase() === 'invite');
    if (inviteIdx >= 0 && parts[inviteIdx + 1]) {
      return decodeURIComponent(parts[inviteIdx + 1]).trim();
    }
  } catch {}

  const stripped = raw.replace(/^wyvern:\/\//i, '');
  return stripped.split(/[/?#]/)[0].trim();
}

function inviteCodeFromLocation() {
  const parts = location.pathname.split('/').filter(Boolean);
  if (parts.length >= 2 && parts[0].toLowerCase() === 'invite') {
    return decodeURIComponent(parts[1]);
  }
  return null;
}

function clearInviteLocation() {
  if (location.pathname.toLowerCase().startsWith('/invite/')) {
    history.replaceState({}, '', '/');
  }
}

function escapeMarkdownHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatMarkdownInline(text) {
  return escapeMarkdownHtml(text)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function markdownToHtml(markdown) {
  const lines = String(markdown || '').replace(/\r\n/g, '\n').split('\n');
  const html = [];
  let inList = null;
  let inCode = false;
  let codeLines = [];
  let paragraphLines = [];

  const flushParagraph = () => {
    if (!paragraphLines.length) return;
    html.push(`<p>${formatMarkdownInline(paragraphLines.join(' '))}</p>`);
    paragraphLines = [];
  };

  const closeList = () => {
    if (!inList) return;
    html.push(`</${inList}>`);
    inList = null;
  };

  const flushCode = () => {
    html.push(`<pre><code>${escapeMarkdownHtml(codeLines.join('\n'))}</code></pre>`);
    codeLines = [];
  };

  for (const rawLine of lines) {
    const line = rawLine.trimEnd();

    if (line.startsWith('```')) {
      if (inCode) {
        flushCode();
        inCode = false;
      } else {
        flushParagraph();
        closeList();
        inCode = true;
      }
      continue;
    }

    if (inCode) {
      codeLines.push(rawLine);
      continue;
    }

    if (!line.trim()) {
      flushParagraph();
      closeList();
      continue;
    }

    const headingMatch = line.match(/^(#{1,3})\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      closeList();
      const level = headingMatch[1].length;
      html.push(`<h${level}>${formatMarkdownInline(headingMatch[2])}</h${level}>`);
      continue;
    }

    const bulletMatch = line.match(/^[-*]\s+(.+)$/);
    if (bulletMatch) {
      flushParagraph();
      if (inList !== 'ul') {
        closeList();
        html.push('<ul>');
        inList = 'ul';
      }
      html.push(`<li>${formatMarkdownInline(bulletMatch[1])}</li>`);
      continue;
    }

    const orderedMatch = line.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (inList !== 'ol') {
        closeList();
        html.push('<ol>');
        inList = 'ol';
      }
      html.push(`<li>${formatMarkdownInline(orderedMatch[1])}</li>`);
      continue;
    }

    const quoteMatch = line.match(/^>\s+(.+)$/);
    if (quoteMatch) {
      flushParagraph();
      closeList();
      html.push(`<blockquote>${formatMarkdownInline(quoteMatch[1])}</blockquote>`);
      continue;
    }

    paragraphLines.push(line);
  }

  flushParagraph();
  closeList();
  if (inCode && codeLines.length) {
    flushCode();
  }

  return html.join('\n');
}

let changelogLoaded = false;

async function loadChangelog() {
  if (changelogLoaded) return;
  changelogLoaded = true;

  const status = document.getElementById('changelog-status');
  const content = document.getElementById('changelog-content');
  if (!status || !content) return;

  try {
    const res = await fetch(base('/changelog.md'), { cache: 'no-store' });
    if (!res.ok) throw new Error(`Changelog request failed with ${res.status}`);
    const markdown = await res.text();
    content.innerHTML = markdownToHtml(markdown);
    content.hidden = false;
    status.hidden = true;
  } catch (error) {
    status.textContent = 'The changelog could not be loaded right now.';
    content.hidden = true;
    console.error('Failed to load changelog:', error);
  }
}

function showSettingsModal({
  title,
  subtitle,
  nameLabel,
  namePlaceholder,
  initialName = '',
  iconLabel = 'Icon',
  iconHelp = 'Upload a PNG/JPG/WebP or paste a URL.',
  initialIcon = null,
  detailsLabel = null,
  detailsPlaceholder = '',
  initialDetails = '',
  detailsMaxLength = 280,
  toggleLabel = null,
  toggleHelp = '',
  initialToggle = false,
  saveLabel = 'Save Changes',
  requireName = true,
  onSave,
}) {
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal settings-modal' });

  let iconUrl = (initialIcon || '').trim();
  let detailsValue = String(initialDetails || '');
  let toggleValue = !!initialToggle;
  let saving = false;
  let uploading = false;

  const fileInput = el('input', { type: 'file', accept: 'image/*' });
  fileInput.style.display = 'none';

  const titleEl = el('div', { class: 'settings-title' }, title);
  const subtitleEl = el('div', { class: 'settings-subtitle' }, subtitle || '');
  const head = el('div', { class: 'settings-head' }, titleEl, subtitleEl);

  const preview = el('div', { class: 'settings-icon-preview' });
  const nameInput = el('input', {
    class: 'settings-input',
    type: 'text',
    value: initialName || '',
    placeholder: namePlaceholder || '',
    maxlength: '64',
  });
  const iconInput = el('input', {
    class: 'settings-input',
    type: 'text',
    value: iconUrl,
    placeholder: 'https://... or /media/...',
  });
  const iconInputWrap = el('div', { class: 'settings-field' },
    el('label', {}, `${iconLabel} URL`),
    iconInput
  );

  const errEl = el('div', { class: 'settings-error' });
  errEl.style.display = 'none';

  const uploadBtn = el('button', {
    class: 'btn-soft',
    type: 'button',
    onClick: () => {
      if (uploading || saving) return;
      fileInput.click();
    }
  }, 'Upload Image');
  const clearBtn = el('button', {
    class: 'btn-soft btn-danger-ghost',
    type: 'button',
    onClick: () => {
      if (saving || uploading) return;
      iconUrl = '';
      iconInput.value = '';
      renderPreview();
    }
  }, 'Remove Icon');

  const iconMeta = el('div', { class: 'settings-icon-meta' },
    el('div', { class: 'settings-icon-label' }, iconLabel),
    el('div', { class: 'settings-icon-help' }, iconHelp),
    el('div', { class: 'settings-upload-actions' }, uploadBtn, clearBtn)
  );
  const iconRow = el('div', { class: 'settings-icon-row' }, preview, iconMeta);

  const body = el('div', { class: 'settings-body' },
    iconRow,
    iconInputWrap,
    el('div', { class: 'settings-field' },
      el('label', {}, nameLabel),
      nameInput
    ),
    errEl
  );

  let detailsInput = null;
  if (detailsLabel) {
    detailsInput = el('textarea', {
      class: 'settings-textarea',
      placeholder: detailsPlaceholder || '',
      maxlength: String(detailsMaxLength || 280),
    });
    detailsInput.value = detailsValue;
    detailsInput.addEventListener('input', () => {
      detailsValue = detailsInput.value;
    });
    body.appendChild(
      el('div', { class: 'settings-field' },
        el('label', {}, detailsLabel),
        detailsInput,
      )
    );
  }

  let toggleBtn = null;
  if (toggleLabel) {
    toggleBtn = el('button', {
      class: `settings-switch${toggleValue ? ' on' : ''}`,
      type: 'button',
      onClick: () => {
        if (saving) return;
        toggleValue = !toggleValue;
        toggleBtn.classList.toggle('on', toggleValue);
      },
    });
    body.appendChild(
      el('div', { class: 'settings-toggle' },
        el('div', { class: 'settings-toggle-main' },
          el('div', { class: 'settings-toggle-title' }, toggleLabel),
          el('div', { class: 'settings-toggle-help' }, toggleHelp || ''),
        ),
        toggleBtn,
      )
    );
  }

  body.appendChild(fileInput);

  const cancelBtn = el('button', {
    class: 'btn-ghost',
    type: 'button',
    onClick: () => {
      if (!saving) overlay.remove();
    }
  }, 'Cancel');
  const saveBtn = el('button', { class: 'btn-confirm', type: 'button' }, saveLabel);

  const actions = el('div', { class: 'settings-actions' }, cancelBtn, saveBtn);
  modal.append(head, body, actions);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  function setError(message = '') {
    const msg = (message || '').trim();
    if (!msg) {
      errEl.style.display = 'none';
      errEl.textContent = '';
      return;
    }
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }

  function setBusyState() {
    uploadBtn.disabled = saving || uploading;
    clearBtn.disabled = saving || uploading;
    iconInput.disabled = saving || uploading;
    nameInput.disabled = saving;
    if (detailsInput) detailsInput.disabled = saving;
    if (toggleBtn) toggleBtn.disabled = saving;
    saveBtn.disabled = saving || uploading;
    saveBtn.textContent = saving ? 'Saving...' : saveLabel;
    uploadBtn.textContent = uploading ? 'Uploading...' : 'Upload Image';
  }

  function previewText() {
    const source = nameInput.value?.trim() || initialName || iconLabel || '?';
    return initials(source || '?');
  }

  function renderPreview() {
    preview.innerHTML = '';
    const nextUrl = (iconUrl || '').trim();
    if (!nextUrl) {
      preview.appendChild(el('span', { class: 'settings-icon-fallback' }, previewText()));
      return;
    }
    const img = el('img', { src: nextUrl, alt: `${iconLabel} preview` });
    img.addEventListener('error', () => {
      if (!preview.contains(img)) return;
      preview.innerHTML = '';
      preview.appendChild(el('span', { class: 'settings-icon-fallback' }, previewText()));
    });
    preview.appendChild(img);
  }

  iconInput.addEventListener('input', () => {
    iconUrl = iconInput.value.trim();
    renderPreview();
  });
  nameInput.addEventListener('input', () => {
    if (!(iconUrl || '').trim()) renderPreview();
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files?.[0];
    fileInput.value = '';
    if (!file) return;
    setError('');
    uploading = true;
    setBusyState();
    try {
      toast(`Uploading ${file.name}...`, 'info', 5000);
      const result = await uploads.upload(file);
      const uploadedUrl = (result?.url || result?.file_url || '').trim();
      if (!uploadedUrl) throw new Error('Upload response missing URL');
      iconUrl = uploadedUrl;
      iconInput.value = uploadedUrl;
      renderPreview();
      toast('Image uploaded', 'success');
    } catch (err) {
      setError(err?.message || 'Failed to upload image');
      toast(err?.message || 'Failed to upload image', 'error');
    } finally {
      uploading = false;
      setBusyState();
    }
  });

  saveBtn.addEventListener('click', async () => {
    if (saving || uploading) return;
    setError('');
    const name = nameInput.value.trim();
    if (requireName && !name) {
      setError(`${nameLabel} is required`);
      return;
    }
    saving = true;
    setBusyState();
    try {
      await onSave({
        name,
        icon: (iconUrl || '').trim() || null,
        details: detailsInput ? detailsValue.trim() : '',
        toggle: !!toggleValue,
      });
      overlay.remove();
    } catch (err) {
      setError(err?.message || 'Failed to save changes');
    } finally {
      saving = false;
      setBusyState();
    }
  });

  overlay.addEventListener('click', (event) => {
    if (event.target === overlay && !saving) overlay.remove();
  });
  window.setTimeout(() => nameInput.focus(), 30);
  renderPreview();
  setBusyState();
}

  const currentUserId = Number(store.state.user?.id || 0);

  function renderUsers() {
    const q = (search.value || '').trim().toLowerCase();
    const users = state.users.filter((user) => {
      const label = `${displayName(user)} ${user.username}#${user.discriminator} ${user.bio || ''}`.toLowerCase();
      return !q || label.includes(q);
    });

    list.innerHTML = '';
    if (!users.length) {
      list.appendChild(el('div', { class: 'directory-empty' }, 'No users available right now.'));
      return;
    }

    for (const user of users) {
      const label = displayName(user);
      const card = el('div', { class: 'directory-card' });
      card.appendChild(avatarEl(label, 'member-av', 42, user.avatar));

      const main = el('div', { class: 'directory-main' },
        el('div', { class: 'directory-name' },
          label,
          el('span', { class: 'dir-pill' }, user.directory_opt_in ? 'Public' : 'Private'),
        ),
        el('div', { class: 'directory-meta' }, `${user.username}#${user.discriminator}`),
      );
      if (user.bio) {
        main.appendChild(el('div', { class: 'directory-bio' }, user.bio));
      }
      card.appendChild(main);

      const act = el('div', { class: 'directory-actions' });
      if (Number(user.id) === currentUserId) {
        act.appendChild(el('button', { class: 'btn-soft', type: 'button', disabled: true }, 'You'));
      } else {
        act.appendChild(el('button', {
          class: 'btn-soft',
          type: 'button',
          onClick: async () => {
            try {
              const dm = await dms.create(user.id);
              if (!dm.participants?.length) {
                dm.participants = [store.state.user, user].filter(Boolean);
              }
              await onOpenDm(dm);
              overlay.remove();
            } catch (err) {
              toast(err?.message || 'Could not open DM', 'error');
            }
          }
        }, 'Open DMs'));
      }
      card.appendChild(act);
      list.appendChild(card);
    }
  }

  search.addEventListener('input', renderUsers);
  overlay.addEventListener('click', (event) => {
    if (event.target === overlay) overlay.remove();
  });

  (async () => {
    try {
      const usersFound = await users.directory();
      state.users = (usersFound || []).filter((user) => !!user?.id);
      for (const user of state.users) {
        if (user?.id) userCache.set(user.id, user);
      }
      renderUsers();
    } catch (err) {
      list.innerHTML = '';
      list.appendChild(el('div', { class: 'directory-empty' }, err?.message || 'Failed to load directory.'));
    }
  })();
}

function showServerDirectoryModal({ onSelectServer }) {
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal directory-modal' });
  const head = el('div', { class: 'directory-head' },
    el('div', { class: 'directory-title' }, 'Server Directory'),
    el('div', { class: 'directory-subtitle' }, 'Browse public servers and join instantly.')
  );
  const body = el('div', { class: 'directory-body' });
  const search = el('input', {
    class: 'directory-search',
    type: 'text',
    placeholder: 'Search servers...',
  });
  const list = el('div', { class: 'directory-list' }, el('div', { class: 'directory-empty' }, 'Loading servers...'));
  const actions = el('div', { class: 'modal-actions' },
    el('button', { class: 'btn-ghost', type: 'button', onClick: () => overlay.remove() }, 'Close')
  );
  body.append(search, list);
  modal.append(head, body, actions);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const state = { entries: [] };

  function renderServers() {
    const q = (search.value || '').trim().toLowerCase();
    const entries = state.entries.filter((entry) => {
      const server = entry?.server || {};
      const label = `${server.name || ''} ${server.description || ''}`.toLowerCase();
      return !q || label.includes(q);
    });

    list.innerHTML = '';
    if (!entries.length) {
      list.appendChild(el('div', { class: 'directory-empty' }, 'No public servers found.'));
      return;
    }

    for (const entry of entries) {
      const server = entry.server || {};
      const label = server.name || 'Server';

      const card = el('div', { class: 'directory-card' });
      card.appendChild(avatarEl(label, 'member-av', 42, server.icon));

      const main = el('div', { class: 'directory-main' },
        el('div', { class: 'directory-name' },
          label,
          el('span', { class: 'dir-pill' }, `${entry.member_count || 0} Members`),
        ),
        el('div', { class: 'directory-meta' }, server.description || 'No description yet.'),
      );
      card.appendChild(main);

      const act = el('div', { class: 'directory-actions' });
      act.appendChild(el('button', {
        class: 'btn-soft',
        type: 'button',
        onClick: async () => {
          try {
            if (!entry.joined) {
              await servers.join(server.id);
              entry.joined = true;
              const existing = store.state.servers || [];
              if (!existing.some((srv) => Number(srv.id) === Number(server.id))) {
                store.set({ servers: [server, ...existing] });
              }
            }
            await onSelectServer(server.id);
            overlay.remove();
          } catch (err) {
            toast(err?.message || 'Could not join server', 'error');
          }
        }
      }, entry.joined ? 'Open Server' : 'Join Server'));
      card.appendChild(act);

      list.appendChild(card);
    }
  }

  search.addEventListener('input', renderServers);
  overlay.addEventListener('click', (event) => {
    if (event.target === overlay) overlay.remove();
  });

  (async () => {
    try {
      state.entries = (await servers.directory()) || [];
      renderServers();
    } catch (err) {
      list.innerHTML = '';
      list.appendChild(el('div', { class: 'directory-empty' }, err?.message || 'Failed to load directory.'));
    }
  })();
}
