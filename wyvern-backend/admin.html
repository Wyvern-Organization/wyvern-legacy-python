<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyvern Admin</title>
  <link rel="icon" href="/static/wyvern-logo.png" />
  <style>
    :root {
      --bg: #111218;
      --bg-soft: #191b24;
      --card: #1f2230;
      --stroke: #2f3550;
      --text: #f4f5ff;
      --muted: #9fa5c8;
      --brand: #5662f6;
      --ok: #2ecc71;
      --warn: #f39c12;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Inter", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(86,98,246,0.18), transparent 40%),
        radial-gradient(circle at 88% 20%, rgba(122,132,255,0.12), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 16px;
    }
    .topbar {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .brand img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid var(--stroke);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn.primary {
      background: var(--brand);
      border-color: transparent;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .stat {
      background: var(--bg-soft);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 14px;
    }
    .stat .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }
    .stat .value {
      margin-top: 6px;
      font-size: 28px;
      font-weight: 700;
    }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1.2fr 1fr;
    }
    .panel {
      background: var(--bg-soft);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      min-height: 260px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--stroke);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .panel-body {
      padding: 10px;
      overflow: auto;
      max-height: 520px;
    }
    .activity-item {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.02);
    }
    .activity-item:last-child { margin-bottom: 0; }
    .activity-title { font-size: 13px; font-weight: 600; }
    .activity-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .activity-meta {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .list {
      display: grid;
      gap: 8px;
    }
    .row {
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .avatar, .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #323650;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      overflow: hidden;
    }
    .avatar img, .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tag {
      font-size: 11px;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px;
      font-size: 13px;
    }
    .status-line {
      font-size: 12px;
      color: var(--muted);
    }
    .status-line.ok { color: var(--ok); }
    .status-line.warn { color: var(--warn); }
    @media (max-width: 1000px) {
      .stats { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <img src="/static/wyvern-logo.png" alt="Wyvern" />
        <span>Wyvern Admin</span>
      </div>
      <div class="top-actions">
        <span id="status" class="status-line">Loading...</span>
        <button id="refreshBtn" class="btn">Refresh</button>
        <a class="btn primary" href="/">Open Wyvern</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">Users</div><div id="usersCount" class="value">-</div></div>
      <div class="stat"><div class="label">Servers</div><div id="serversCount" class="value">-</div></div>
      <div class="stat"><div class="label">Activity Events</div><div id="eventsCount" class="value">-</div></div>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="panel-head"><div class="panel-title">Activity</div></div>
        <div id="activity" class="panel-body"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><div class="panel-title">Users</div></div>
        <div id="users" class="panel-body"></div>
      </section>

      <section class="panel" style="grid-column: 1 / -1;">
        <div class="panel-head"><div class="panel-title">Servers</div></div>
        <div id="servers" class="panel-body"></div>
      </section>
    </div>
  </div>

  <script>
    const API_PREFIX = '/api/v1';
    const statusEl = document.getElementById('status');

    const els = {
      usersCount: document.getElementById('usersCount'),
      serversCount: document.getElementById('serversCount'),
      eventsCount: document.getElementById('eventsCount'),
      activity: document.getElementById('activity'),
      users: document.getElementById('users'),
      servers: document.getElementById('servers'),
      refreshBtn: document.getElementById('refreshBtn'),
    };

    function initials(value) {
      const text = String(value || '?').trim();
      if (!text) return '?';
      const parts = text.split(/\s+/).slice(0, 2);
      return parts.map((part) => part.charAt(0).toUpperCase()).join('') || '?';
    }

    function fmtTs(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return '-';
      return d.toLocaleString();
    }

    function authHeader() {
      const access = sessionStorage.getItem('wy_access');
      return access ? { Authorization: `Bearer ${access}` } : {};
    }

    async function req(path) {
      const res = await fetch(`${API_PREFIX}${path}`, {
        headers: { ...authHeader() },
      });

      if (res.status === 401) {
        throw new Error('Please sign in first to access admin.');
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data?.success) {
        throw new Error(data?.error?.message || 'Request failed');
      }
      return data.data;
    }

    function makeAvatar(name, imgUrl) {
      const wrap = document.createElement('div');
      wrap.className = 'avatar';
      if (imgUrl) {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.alt = name;
        img.addEventListener('error', () => {
          wrap.innerHTML = '';
          wrap.textContent = initials(name);
        }, { once: true });
        wrap.appendChild(img);
      } else {
        wrap.textContent = initials(name);
      }
      return wrap;
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status-line${type ? ` ${type}` : ''}`;
    }

    function renderUsers(users) {
      if (!users.length) {
        els.users.innerHTML = '<div class="empty">No users found.</div>';
        return;
      }
      const list = document.createElement('div');
      list.className = 'list';

      for (const user of users) {
        const row = document.createElement('div');
        row.className = 'row';

        const label = user.display_name || user.username || 'User';
        row.appendChild(makeAvatar(label, user.avatar));

        const content = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = label;
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = `${user.username}#${user.discriminator} • ${user.email}${user.bio ? ` • ${user.bio}` : ''}`;
        content.append(name, sub);
        row.appendChild(content);

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = user.directory_opt_in ? 'Directory On' : 'Directory Off';
        row.appendChild(tag);

        list.appendChild(row);
      }
      els.users.replaceChildren(list);
    }

    function renderServers(servers) {
      if (!servers.length) {
        els.servers.innerHTML = '<div class="empty">No servers found.</div>';
        return;
      }
      const list = document.createElement('div');
      list.className = 'list';

      for (const server of servers) {
        const row = document.createElement('div');
        row.className = 'row';

        const icon = document.createElement('div');
        icon.className = 'icon';
        if (server.icon) {
          const img = document.createElement('img');
          img.src = server.icon;
          img.alt = server.name || 'Server';
          img.addEventListener('error', () => {
            icon.innerHTML = '';
            icon.textContent = initials(server.name || 'S');
          }, { once: true });
          icon.appendChild(img);
        } else {
          icon.textContent = initials(server.name || 'S');
        }
        row.appendChild(icon);

        const content = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = server.name || 'Server';
        const sub = document.createElement('div');
        sub.className = 'sub';
        const desc = (server.description || '').trim();
        sub.textContent = `${desc || 'No description'} • ${server.member_count || 0} members`;
        content.append(name, sub);
        row.appendChild(content);

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = server.directory_opt_in ? 'Directory On' : 'Directory Off';
        row.appendChild(tag);

        list.appendChild(row);
      }

      els.servers.replaceChildren(list);
    }

    function renderActivity(activity) {
      if (!activity.length) {
        els.activity.innerHTML = '<div class="empty">No activity yet.</div>';
        return;
      }

      const frag = document.createDocumentFragment();
      for (const item of activity) {
        const card = document.createElement('div');
        card.className = 'activity-item';

        const title = document.createElement('div');
        title.className = 'activity-title';
        title.textContent = item.title || item.type || 'Activity';

        const sub = document.createElement('div');
        sub.className = 'activity-sub';
        sub.textContent = item.subtitle || '';

        const meta = document.createElement('div');
        meta.className = 'activity-meta';
        const preview = document.createElement('span');
        preview.textContent = item.preview || '';
        const time = document.createElement('span');
        time.textContent = fmtTs(item.timestamp);
        meta.append(preview, time);

        card.append(title, sub, meta);
        frag.appendChild(card);
      }

      els.activity.replaceChildren(frag);
    }

    async function loadOverview() {
      setStatus('Loading admin overview...');
      try {
        const data = await req('/admin/overview');
        const users = Array.isArray(data?.users) ? data.users : [];
        const servers = Array.isArray(data?.servers) ? data.servers : [];
        const activity = Array.isArray(data?.activity) ? data.activity : [];

        els.usersCount.textContent = String(users.length);
        els.serversCount.textContent = String(servers.length);
        els.eventsCount.textContent = String(activity.length);

        renderUsers(users);
        renderServers(servers);
        renderActivity(activity);

        setStatus(`Updated ${new Date().toLocaleTimeString()}`, 'ok');
      } catch (err) {
        els.users.innerHTML = '<div class="empty">Could not load users.</div>';
        els.servers.innerHTML = '<div class="empty">Could not load servers.</div>';
        els.activity.innerHTML = '<div class="empty">Could not load activity.</div>';
        setStatus(err?.message || 'Failed to load admin overview', 'warn');
      }
    }

    els.refreshBtn.addEventListener('click', loadOverview);
    loadOverview();
    setInterval(loadOverview, 20000);
  </script>
</body>
</html>
